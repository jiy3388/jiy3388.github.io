<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>체육 수업 관리 포털</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .header { text-align: center; padding: 20px; background-color: #2c3e50; color: white; border-radius: 10px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card h2 { color: #2980b9; margin-top: 0; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #27ae60; color: white; text-decoration: none; border-radius: 5px; margin-top: 10px; }
        .btn:hover { background-color: #2ecc71; }
    </style>
</head>
<body>

    <div class="header">
        <h1>정일용 선생님의 수업 도구 포털</h1>
        <p>어디서든 접속 가능한 나만의 스마트 체육 수업 환경</p>
    </div>

    <div class="grid">
        <div class="card">
            <h2>체육관 전광판</h2>
            <p>실시간 점수 및 세트 스코어 관리</p>
            <a href="#" class="btn">실행하기</a>
        </div>
        <div class="card">
            <h2>수업 타이머</h2>
            <p>인터벌 트레이닝 및 경기 시간 측정</p>
            <a href="#" class="btn">실행하기</a>
        </div>
        <div class="card">
            <h2>걷기 리더보드</h2>
            <p>교내 걷기 챌린지 실시간 순위표</p>
            <a href="#" class="btn">실행하기</a>
        </div>
    </div>

</body>
</html>
